[package]
name = "piforma-panel"
version = "0.1.0"
description = "Classic PiForma menu bar"
authors = ["PiForma"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = [] }
